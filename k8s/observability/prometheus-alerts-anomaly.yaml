apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alerts-anomaly
  namespace: observability
data:
  anomaly-alerts.yml: |
    groups:
      # ================================================================
      #  LATENCY ANOMALY DETECTION
      #
      #  Baseline: 2h sliding window (1h-dan daha stabil)
      #  Guard:    minimum 1 rps traffic floor
      #  Reason:   gecə az traffic olanda (< 1 rps) percentil hesabları
      #            statistik cəhətdən unreliable olur — 1 yavaş request
      #            P99-u partladır. Traffic floor bunu aradan qaldırır.
      # ================================================================
      - name: latency-anomaly
        rules:
          - alert: LatencyP99SpikeAnomaly
            expr: |
              (
                (
                  histogram_quantile(0.99,
                    sum by (le, namespace, ingress, host, cluster) (
                      rate(nginx_ingress_controller_request_duration_seconds_bucket[10m])
                    )
                  )
                  > 3 *
                  histogram_quantile(0.99,
                    sum by (le, namespace, ingress, host, cluster) (
                      rate(nginx_ingress_controller_request_duration_seconds_bucket[2h])
                    )
                  )
                )
                and
                (
                  histogram_quantile(0.99,
                    sum by (le, namespace, ingress, host, cluster) (
                      rate(nginx_ingress_controller_request_duration_seconds_bucket[2h])
                    )
                  ) > 0.01
                )
                and
                (
                  sum by (namespace, ingress, host, cluster) (
                    rate(nginx_ingress_controller_requests[10m])
                  ) > 1
                )
              )
              * on(namespace, cluster) group_left()
              max by (namespace, cluster) (kube_pod_labels{environment="prod", team="Fintech-Sre"})
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "[Anomaly] Ingress {{ $labels.namespace }}/{{ $labels.ingress }} P99 latency kəskin artıb"
              description: >-
                Ingress {{ $labels.host }} ({{ $labels.namespace }}/{{ $labels.ingress }})
                P99 latency {{ $value | printf "%.2f" }}s — 2 saatlıq baseline-dan
                3x artıq. Backend degradation və ya upstream dependency problemi
                ola bilər. Cluster: {{ $labels.cluster }}.

          - alert: LatencyP50SpikeAnomaly
            expr: |
              (
                (
                  histogram_quantile(0.50,
                    sum by (le, namespace, ingress, host, cluster) (
                      rate(nginx_ingress_controller_request_duration_seconds_bucket[10m])
                    )
                  )
                  > 2.5 *
                  histogram_quantile(0.50,
                    sum by (le, namespace, ingress, host, cluster) (
                      rate(nginx_ingress_controller_request_duration_seconds_bucket[2h])
                    )
                  )
                )
                and
                (
                  histogram_quantile(0.50,
                    sum by (le, namespace, ingress, host, cluster) (
                      rate(nginx_ingress_controller_request_duration_seconds_bucket[2h])
                    )
                  ) > 0.005
                )
                and
                (
                  sum by (namespace, ingress, host, cluster) (
                    rate(nginx_ingress_controller_requests[10m])
                  ) > 1
                )
              )
              * on(namespace, cluster) group_left()
              max by (namespace, cluster) (kube_pod_labels{environment="prod", team="Fintech-Sre"})
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "[Anomaly] Ingress {{ $labels.namespace }}/{{ $labels.ingress }} median latency 2.5x artıb"
              description: >-
                Ingress {{ $labels.host }} ({{ $labels.namespace }}/{{ $labels.ingress }})
                median (P50) latency {{ $value | printf "%.3f" }}s — 2 saatlıq
                baseline-dan 2.5x artıq. Requestlərin əksəriyyəti təsirlənir.
                Cluster: {{ $labels.cluster }}.

          - alert: LatencyP99AbsoluteAnomaly
            expr: |
              (
                (
                  histogram_quantile(0.99,
                    sum by (le, namespace, ingress, host, cluster) (
                      rate(nginx_ingress_controller_request_duration_seconds_bucket[10m])
                    )
                  ) > 10
                )
                and
                (
                  histogram_quantile(0.99,
                    sum by (le, namespace, ingress, host, cluster) (
                      rate(nginx_ingress_controller_request_duration_seconds_bucket[2h])
                    )
                  ) < 5
                )
                and
                (
                  sum by (namespace, ingress, host, cluster) (
                    rate(nginx_ingress_controller_requests[10m])
                  ) > 1
                )
              )
              * on(namespace, cluster) group_left()
              max by (namespace, cluster) (kube_pod_labels{environment="prod", team="Fintech-Sre"})
            for: 10m
            labels:
              severity: critical
            annotations:
              summary: "[Anomaly] Ingress {{ $labels.namespace }}/{{ $labels.ingress }} P99 latency 10s-i keçib"
              description: >-
                Ingress {{ $labels.host }} ({{ $labels.namespace }}/{{ $labels.ingress }})
                P99 latency {{ $value | printf "%.1f" }}s-ə yüksəlib (2h baseline < 5s).
                Backend failure, resource exhaustion, və ya external dependency
                timeout ola bilər. Cluster: {{ $labels.cluster }}.

          - alert: LatencyGradualDegradation
            expr: |
              (
                (
                  histogram_quantile(0.95,
                    sum by (le, namespace, ingress, host, cluster) (
                      rate(nginx_ingress_controller_request_duration_seconds_bucket[30m])
                    )
                  )
                  > 1.5 *
                  histogram_quantile(0.95,
                    sum by (le, namespace, ingress, host, cluster) (
                      rate(nginx_ingress_controller_request_duration_seconds_bucket[6h])
                    )
                  )
                )
                and
                (
                  histogram_quantile(0.95,
                    sum by (le, namespace, ingress, host, cluster) (
                      rate(nginx_ingress_controller_request_duration_seconds_bucket[6h])
                    )
                  ) > 0.01
                )
                and
                (
                  sum by (namespace, ingress, host, cluster) (
                    rate(nginx_ingress_controller_requests[30m])
                  ) > 0.5
                )
              )
              * on(namespace, cluster) group_left()
              max by (namespace, cluster) (kube_pod_labels{environment="prod", team="Fintech-Sre"})
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: "[Anomaly] Ingress {{ $labels.namespace }}/{{ $labels.ingress }} latency tədricən artır"
              description: >-
                Ingress {{ $labels.host }} ({{ $labels.namespace }}/{{ $labels.ingress }})
                P95 latency son 30 dəqiqədə {{ $value | printf "%.2f" }}s — 6 saatlıq
                baseline-dan 1.5x artıq. Memory leak, connection pool exhaustion,
                və ya queue depth artımı ola bilər. Cluster: {{ $labels.cluster }}.

          - alert: UpstreamResponseTimeAnomaly
            expr: |
              (
                (
                  histogram_quantile(0.99,
                    sum by (le, namespace, ingress, host, cluster) (
                      rate(nginx_ingress_controller_response_duration_seconds_bucket[10m])
                    )
                  )
                  > 3 *
                  histogram_quantile(0.99,
                    sum by (le, namespace, ingress, host, cluster) (
                      rate(nginx_ingress_controller_response_duration_seconds_bucket[2h])
                    )
                  )
                )
                and
                (
                  histogram_quantile(0.99,
                    sum by (le, namespace, ingress, host, cluster) (
                      rate(nginx_ingress_controller_response_duration_seconds_bucket[2h])
                    )
                  ) > 0.01
                )
                and
                (
                  sum by (namespace, ingress, host, cluster) (
                    rate(nginx_ingress_controller_requests[10m])
                  ) > 1
                )
              )
              * on(namespace, cluster) group_left()
              max by (namespace, cluster) (kube_pod_labels{environment="prod", team="Fintech-Sre"})
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "[Anomaly] Ingress {{ $labels.namespace }}/{{ $labels.ingress }} upstream response time anomal"
              description: >-
                Ingress {{ $labels.host }} ({{ $labels.namespace }}/{{ $labels.ingress }})
                upstream (backend) P99 response time {{ $value | printf "%.2f" }}s —
                2 saatlıq baseline-dan 3x artıq. Problem spesifik olaraq backend
                tərəfdədir (nginx/network deyil). Cluster: {{ $labels.cluster }}.

      # ================================================================
      #  TRAFFIC ANOMALY DETECTION (WEEK-OVER-WEEK)
      #
      #  Baseline: offset 7d (keçən həftənin eyni günü/saatı ilə müqayisə)
      #  Reason:   load əsasən 9:00-20:00 iş günlərində olur, bazar günü
      #            demək olar ki request yoxdur. offset 24h istifadə etsək:
      #            - bazar ertəsi vs bazar → false spike (0 → normal)
      #            - bazar vs şənbə → false drop (normal → 0)
      #            offset 7d həftəlik cycle-ı nəzərə alır:
      #            - bazar ertəsi vs keçən bazar ertəsi (hər ikisi normal)
      #            - bazar vs keçən bazar (hər ikisi ~0)
      #            - cümə vs keçən cümə (eyni pattern)
      # ================================================================
      - name: traffic-anomaly
        rules:
          - alert: TrafficDropAnomaly
            expr: |
              (
                (
                  sum by (namespace, ingress, host, cluster) (
                    rate(nginx_ingress_controller_requests[15m])
                  )
                  < 0.4 *
                  sum by (namespace, ingress, host, cluster) (
                    rate(nginx_ingress_controller_requests[15m] offset 7d)
                  )
                )
                and
                (
                  sum by (namespace, ingress, host, cluster) (
                    rate(nginx_ingress_controller_requests[15m] offset 7d)
                  ) > 1
                )
              )
              * on(namespace, cluster) group_left()
              max by (namespace, cluster) (kube_pod_labels{environment="prod", team="Fintech-Sre"})
            for: 10m
            labels:
              severity: critical
            annotations:
              summary: "[Anomaly] Ingress {{ $labels.namespace }}/{{ $labels.ingress }} traffic kəskin azalıb (week-over-week)"
              description: >-
                Ingress {{ $labels.host }} ({{ $labels.namespace }}/{{ $labels.ingress }})
                traffic keçən həftənin eyni gün/saatının {{ $value | humanizePercentage }}-nə
                düşüb (baseline: keçən həftə > 1 rps). DNS problemi, routing failure,
                və ya client-side breakage ola bilər. Cluster: {{ $labels.cluster }}.

          - alert: TrafficSpikeAnomaly
            expr: |
              (
                (
                  sum by (namespace, ingress, host, cluster) (
                    rate(nginx_ingress_controller_requests[15m])
                  )
                  > 5 *
                  sum by (namespace, ingress, host, cluster) (
                    rate(nginx_ingress_controller_requests[15m] offset 7d)
                  )
                )
                and
                (
                  sum by (namespace, ingress, host, cluster) (
                    rate(nginx_ingress_controller_requests[15m] offset 7d)
                  ) > 0.5
                )
                and
                (
                  sum by (namespace, ingress, host, cluster) (
                    rate(nginx_ingress_controller_requests[15m])
                  ) > 5
                )
              )
              * on(namespace, cluster) group_left()
              max by (namespace, cluster) (kube_pod_labels{environment="prod", team="Fintech-Sre"})
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "[Anomaly] Ingress {{ $labels.namespace }}/{{ $labels.ingress }} traffic 5x artıb (week-over-week)"
              description: >-
                Ingress {{ $labels.host }} ({{ $labels.namespace }}/{{ $labels.ingress }})
                keçən həftənin eyni gün/saatından 5x çox traffic alır (hazırda > 5 rps).
                DDoS, bot surge, və ya gözlənilməz yük ola bilər.
                Cluster: {{ $labels.cluster }}.

          - alert: ZeroTrafficAnomaly
            expr: |
              (
                (
                  sum by (namespace, ingress, host, cluster) (
                    rate(nginx_ingress_controller_requests[15m])
                  ) == 0
                )
                and
                (
                  sum by (namespace, ingress, host, cluster) (
                    rate(nginx_ingress_controller_requests[15m] offset 7d)
                  ) > 1
                )
              )
              * on(namespace, cluster) group_left()
              max by (namespace, cluster) (kube_pod_labels{environment="prod", team="Fintech-Sre"})
            for: 15m
            labels:
              severity: critical
            annotations:
              summary: "[Anomaly] Ingress {{ $labels.namespace }}/{{ $labels.ingress }} sıfır traffic alır"
              description: >-
                Ingress {{ $labels.host }} ({{ $labels.namespace }}/{{ $labels.ingress }})
                son 15 dəqiqədə heç bir request almayıb, amma keçən həftə eyni
                gün/saatda > 1 rps traffic var idi. Service tamamilə unreachable
                ola bilər.
                Cluster: {{ $labels.cluster }}.

      # ================================================================
      #  ERROR RATE ANOMALY DETECTION
      #
      #  Baseline: 2h sliding window + minimum traffic floor
      #  Guard:    absolute error rate threshold (noise filtr)
      # ================================================================
      - name: error-rate-anomaly
        rules:
          - alert: ErrorRateAnomaly5xx
            expr: |
              (
                (
                  (
                    sum by (namespace, ingress, host, cluster) (
                      rate(nginx_ingress_controller_requests{status=~"5.."}[10m])
                    )
                    /
                    sum by (namespace, ingress, host, cluster) (
                      rate(nginx_ingress_controller_requests[10m])
                    )
                  )
                  > 3 *
                  (
                    sum by (namespace, ingress, host, cluster) (
                      rate(nginx_ingress_controller_requests{status=~"5.."}[2h])
                    )
                    /
                    sum by (namespace, ingress, host, cluster) (
                      rate(nginx_ingress_controller_requests[2h])
                    )
                  )
                )
                and
                (
                  (
                    sum by (namespace, ingress, host, cluster) (
                      rate(nginx_ingress_controller_requests{status=~"5.."}[10m])
                    )
                    /
                    sum by (namespace, ingress, host, cluster) (
                      rate(nginx_ingress_controller_requests[10m])
                    )
                  ) > 0.01
                )
                and
                (
                  sum by (namespace, ingress, host, cluster) (
                    rate(nginx_ingress_controller_requests[10m])
                  ) > 1
                )
              )
              * on(namespace, cluster) group_left()
              max by (namespace, cluster) (kube_pod_labels{environment="prod", team="Fintech-Sre"})
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "[Anomaly] Ingress {{ $labels.namespace }}/{{ $labels.ingress }} 5xx rate kəskin artıb"
              description: >-
                Ingress {{ $labels.host }} ({{ $labels.namespace }}/{{ $labels.ingress }})
                5xx error rate {{ $value | humanizePercentage }} — 2 saatlıq
                baseline-dan 3x artıq. Backend crash, deployment problemi, və ya
                dependency failure ola bilər. Cluster: {{ $labels.cluster }}.

          - alert: ClientErrorRateAnomaly4xx
            expr: |
              (
                (
                  (
                    sum by (namespace, ingress, host, cluster) (
                      rate(nginx_ingress_controller_requests{status=~"4.."}[10m])
                    )
                    /
                    sum by (namespace, ingress, host, cluster) (
                      rate(nginx_ingress_controller_requests[10m])
                    )
                  )
                  > 3 *
                  (
                    sum by (namespace, ingress, host, cluster) (
                      rate(nginx_ingress_controller_requests{status=~"4.."}[2h])
                    )
                    /
                    sum by (namespace, ingress, host, cluster) (
                      rate(nginx_ingress_controller_requests[2h])
                    )
                  )
                )
                and
                (
                  (
                    sum by (namespace, ingress, host, cluster) (
                      rate(nginx_ingress_controller_requests{status=~"4.."}[10m])
                    )
                    /
                    sum by (namespace, ingress, host, cluster) (
                      rate(nginx_ingress_controller_requests[10m])
                    )
                  ) > 0.1
                )
                and
                (
                  sum by (namespace, ingress, host, cluster) (
                    rate(nginx_ingress_controller_requests[10m])
                  ) > 1
                )
              )
              * on(namespace, cluster) group_left()
              max by (namespace, cluster) (kube_pod_labels{environment="prod", team="Fintech-Sre"})
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "[Anomaly] Ingress {{ $labels.namespace }}/{{ $labels.ingress }} 4xx rate anomal artıb"
              description: >-
                Ingress {{ $labels.host }} ({{ $labels.namespace }}/{{ $labels.ingress }})
                4xx error rate {{ $value | humanizePercentage }} — 2 saatlıq
                baseline-dan 3x artıq. API change sonrası broken client, auth
                problemi, və ya route misconfiguration ola bilər.
                Cluster: {{ $labels.cluster }}.

      # ================================================================
      #  RESOURCE USAGE ANOMALY DETECTION
      #
      #  Baseline: 6h sliding window (resource usage daha stabil pattern)
      #  CPU/Memory gün ərzində traffic ilə birlikdə dəyişir amma
      #  6h window gündüz/gecə keçidini smooth edir.
      # ================================================================
      - name: resource-usage-anomaly
        rules:
          - alert: CPUUsageSpikeAnomaly
            expr: |
              (
                (
                  rate(container_cpu_usage_seconds_total{container!="", image!=""}[10m])
                  /
                  avg_over_time(
                    rate(container_cpu_usage_seconds_total{container!="", image!=""}[10m])[6h:5m]
                  )
                ) > 3
                and
                rate(container_cpu_usage_seconds_total{container!="", image!=""}[10m]) > 0.1
              )
              * on(namespace, pod, cluster) group_left(team, squad, tribe, environment)
              max by (namespace, pod, cluster, team, squad, tribe, environment) (kube_pod_labels{environment="prod", team="Fintech-Sre"})
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "[Anomaly] {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} CPU istifadəsi anomal artıb"
              description: >-
                Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }}
                CPU istifadəsi 6 saatlıq ortalamadan {{ $value | printf "%.1f" }}x artıq.
                Runaway process, infinite loop, və ya gözlənilməz yük ola bilər.
                Cluster: {{ $labels.cluster }}.

          - alert: MemoryLeakAnomaly
            expr: |
              (
                deriv(container_memory_working_set_bytes{container!="", image!=""}[2h]) > 0
                and
                (
                  predict_linear(container_memory_working_set_bytes{container!="", image!=""}[2h], 3600)
                  >
                  on(namespace, pod, container)
                  kube_pod_container_resource_limits{resource="memory"}
                )
                and
                kube_pod_container_resource_limits{resource="memory"} > 0
              )
              * on(namespace, pod, cluster) group_left(team, squad, tribe, environment)
              max by (namespace, pod, cluster, team, squad, tribe, environment) (kube_pod_labels{environment="prod", team="Fintech-Sre"})
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: "[Anomaly] {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} memory artımı anomal — 1 saata limit keçəcək"
              description: >-
                Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }}
                memory davamlı artır. Hazırkı sürətlə 1 saat ərzində memory limit-i
                keçəcək. Bu pattern güclü şəkildə memory leak-ə işarə edir.
                Cluster: {{ $labels.cluster }}.

          - alert: MemoryUsageSpikeAnomaly
            expr: |
              (
                (
                  container_memory_working_set_bytes{container!="", image!=""}
                  /
                  avg_over_time(container_memory_working_set_bytes{container!="", image!=""}[6h])
                ) > 2
                and
                container_memory_working_set_bytes{container!="", image!=""} > 100 * 1024 * 1024
              )
              * on(namespace, pod, cluster) group_left(team, squad, tribe, environment)
              max by (namespace, pod, cluster, team, squad, tribe, environment) (kube_pod_labels{environment="prod", team="Fintech-Sre"})
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "[Anomaly] {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} memory istifadəsi anomal artıb"
              description: >-
                Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }}
                memory istifadəsi 6 saatlıq ortalamadan {{ $value | printf "%.1f" }}x
                artıq (hazırda > 100Mi). Cache buildup, leak, və ya anormal
                request pattern ola bilər. Cluster: {{ $labels.cluster }}.

          - alert: NetworkReceiveAnomaly
            expr: |
              (
                (
                  sum by (namespace, cluster) (
                    rate(container_network_receive_bytes_total[10m])
                  )
                  > 5 *
                  sum by (namespace, cluster) (
                    rate(container_network_receive_bytes_total[10m] offset 7d)
                  )
                )
                and
                (
                  sum by (namespace, cluster) (
                    rate(container_network_receive_bytes_total[10m])
                  ) > 1024 * 1024
                )
                and
                (
                  sum by (namespace, cluster) (
                    rate(container_network_receive_bytes_total[10m] offset 7d)
                  ) > 100 * 1024
                )
              )
              * on(namespace, cluster) group_left()
              max by (namespace, cluster) (kube_pod_labels{environment="prod"})
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "[Anomaly] {{ $labels.namespace }} network receive traffic anomal artıb"
              description: >-
                Namespace {{ $labels.namespace }} keçən həftənin eyni
                gün/saatından 5x çox network traffic alır (hazırda > 1MB/s).
                DDoS, data dump, və ya misconfigured client ola bilər.
                Cluster: {{ $labels.cluster }}.

          - alert: NetworkTransmitAnomaly
            expr: |
              (
                (
                  sum by (namespace, cluster) (
                    rate(container_network_transmit_bytes_total[10m])
                  )
                  > 5 *
                  sum by (namespace, cluster) (
                    rate(container_network_transmit_bytes_total[10m] offset 7d)
                  )
                )
                and
                (
                  sum by (namespace, cluster) (
                    rate(container_network_transmit_bytes_total[10m])
                  ) > 1024 * 1024
                )
                and
                (
                  sum by (namespace, cluster) (
                    rate(container_network_transmit_bytes_total[10m] offset 7d)
                  ) > 100 * 1024
                )
              )
              * on(namespace, cluster) group_left()
              max by (namespace, cluster) (kube_pod_labels{environment="prod"})
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "[Anomaly] {{ $labels.namespace }} network transmit traffic anomal artıb"
              description: >-
                Namespace {{ $labels.namespace }} keçən həftənin eyni
                gün/saatından 5x çox network traffic göndərir (hazırda > 1MB/s).
                Data exfiltration, log flood, və ya anormal response size ola
                bilər. Cluster: {{ $labels.cluster }}.

      # ================================================================
      #  SATURATION & THROUGHPUT ANOMALY DETECTION
      # ================================================================
      - name: saturation-anomaly
        rules:
          - alert: IngressConnectionSaturation
            expr: |
              (
                (
                  sum by (namespace, ingress, host, cluster) (
                    nginx_ingress_controller_nginx_process_connections
                  )
                  > 3 *
                  avg_over_time(
                    sum by (namespace, ingress, host, cluster) (
                      nginx_ingress_controller_nginx_process_connections
                    )[2h:5m]
                  )
                )
                and
                (
                  sum by (namespace, ingress, host, cluster) (
                    nginx_ingress_controller_nginx_process_connections
                  ) > 100
                )
              )
              * on(namespace, cluster) group_left()
              max by (namespace, cluster) (kube_pod_labels{environment="prod", team="Fintech-Sre"})
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "[Anomaly] Ingress {{ $labels.namespace }}/{{ $labels.ingress }} connection sayı anomal artıb"
              description: >-
                Ingress {{ $labels.host }} ({{ $labels.namespace }}/{{ $labels.ingress }})
                aktiv connection-lar 2 saatlıq ortalamadan 3x artıq (> 100).
                Request queuing və latency artımına səbəb ola bilər.
                Cluster: {{ $labels.cluster }}.

          - alert: HighLatencyWithLowErrorRate
            expr: |
              (
                (
                  histogram_quantile(0.95,
                    sum by (le, namespace, ingress, host, cluster) (
                      rate(nginx_ingress_controller_request_duration_seconds_bucket[10m])
                    )
                  ) > 5
                )
                and
                (
                  (
                    sum by (namespace, ingress, host, cluster) (
                      rate(nginx_ingress_controller_requests{status=~"5.."}[10m])
                    )
                    /
                    sum by (namespace, ingress, host, cluster) (
                      rate(nginx_ingress_controller_requests[10m])
                    )
                  ) < 0.01
                )
                and
                (
                  sum by (namespace, ingress, host, cluster) (
                    rate(nginx_ingress_controller_requests[10m])
                  ) > 1
                )
              )
              * on(namespace, cluster) group_left()
              max by (namespace, cluster) (kube_pod_labels{environment="prod", team="Fintech-Sre"})
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "[Anomaly] Ingress {{ $labels.namespace }}/{{ $labels.ingress }} yüksək latency amma error yoxdur"
              description: >-
                Ingress {{ $labels.host }} ({{ $labels.namespace }}/{{ $labels.ingress }})
                P95 latency {{ $value | printf "%.1f" }}s amma 5xx error rate < 1%.
                Requestlər uğurludur amma çox yavaşdır — database lock contention,
                external API slowness, və ya thread pool exhaustion ola bilər.
                Bu "silent" performance problemlər error-rate monitoring ilə
                tutulmur. Cluster: {{ $labels.cluster }}.

          - alert: ContainerThrottlingAnomaly
            expr: |
              (
                (
                  rate(container_cpu_cfs_throttled_seconds_total{container!="", image!=""}[10m])
                  /
                  rate(container_cpu_usage_seconds_total{container!="", image!=""}[10m])
                ) > 0.5
                and
                (
                  rate(container_cpu_cfs_throttled_seconds_total{container!="", image!=""}[10m])
                  /
                  avg_over_time(
                    rate(container_cpu_cfs_throttled_seconds_total{container!="", image!=""}[10m])[2h:5m]
                  )
                ) > 3
              )
              * on(namespace, pod, cluster) group_left(team, squad, tribe, environment)
              max by (namespace, pod, cluster, team, squad, tribe, environment) (kube_pod_labels{environment="prod", team="Fintech-Sre"})
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "[Anomaly] {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} CPU throttling anomal artıb"
              description: >-
                Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }}
                CPU throttling 2 saatlıq ortalamadan 3x artıq və vaxtın > 50%-i
                throttle olunur. Bu birbaşa request latency və throughput-u
                deqrade edir. CPU limit artırılması lazım ola bilər.
                Cluster: {{ $labels.cluster }}.

      # ================================================================
      #  DNS & NETWORK LATENCY ANOMALY DETECTION
      #
      #  Baseline: 2h sliding window
      #  DNS metrikləri traffic pattern-dən asılı deyil,
      #  sadəcə daha stabil baseline kifayətdir.
      # ================================================================
      - name: dns-network-anomaly
        rules:
          - alert: CoreDNSLatencyAnomaly
            expr: |
              (
                (
                  histogram_quantile(0.99,
                    sum by (le, cluster) (
                      rate(coredns_dns_request_duration_seconds_bucket[10m])
                    )
                  )
                  > 3 *
                  histogram_quantile(0.99,
                    sum by (le, cluster) (
                      rate(coredns_dns_request_duration_seconds_bucket[2h])
                    )
                  )
                )
                and
                (
                  histogram_quantile(0.99,
                    sum by (le, cluster) (
                      rate(coredns_dns_request_duration_seconds_bucket[2h])
                    )
                  ) > 0.001
                )
              )
              * on(cluster) group_left()
              max by (cluster) (kube_pod_labels{environment="prod", team="Fintech-Sre"})
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "[Anomaly] CoreDNS P99 latency anomal artıb"
              description: >-
                CoreDNS P99 latency {{ $value | printf "%.3f" }}s — 2 saatlıq
                baseline-dan 3x artıq. DNS resolution yavaşlığı bütün outbound
                connection-lara kaskad effekt yaradacaq.
                Cluster: {{ $labels.cluster }}.

          - alert: CoreDNSErrorRateAnomaly
            expr: |
              (
                (
                  (
                    sum by (cluster) (
                      rate(coredns_dns_responses_total{rcode=~"SERVFAIL|REFUSED"}[10m])
                    )
                    /
                    sum by (cluster) (
                      rate(coredns_dns_responses_total[10m])
                    )
                  )
                  > 3 *
                  (
                    sum by (cluster) (
                      rate(coredns_dns_responses_total{rcode=~"SERVFAIL|REFUSED"}[2h])
                    )
                    /
                    sum by (cluster) (
                      rate(coredns_dns_responses_total[2h])
                    )
                  )
                )
                and
                (
                  (
                    sum by (cluster) (
                      rate(coredns_dns_responses_total{rcode=~"SERVFAIL|REFUSED"}[10m])
                    )
                    /
                    sum by (cluster) (
                      rate(coredns_dns_responses_total[10m])
                    )
                  ) > 0.01
                )
              )
              * on(cluster) group_left()
              max by (cluster) (kube_pod_labels{environment="prod", team="Fintech-Sre"})
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "[Anomaly] CoreDNS error rate anomal artıb"
              description: >-
                CoreDNS SERVFAIL/REFUSED error rate {{ $value | humanizePercentage }} —
                2 saatlıq baseline-dan 3x artıq. DNS failure-lar connection
                timeout-lara və service discovery problemlərinə səbəb olacaq.
                Cluster: {{ $labels.cluster }}.

      # ================================================================
      #  DEPLOYMENT ANOMALY DETECTION
      #
      #  Deployment səviyyəli anomaliyalar: replica availability,
      #  rollout progress, scaling pattern, pod churn.
      #  kube-state-metrics əsasında işləyir.
      # ================================================================
      - name: deployment-anomaly
        rules:
          - alert: DeploymentReplicaAvailabilityDrop
            expr: |
              (
                (
                  kube_deployment_status_replicas_available
                  /
                  kube_deployment_spec_replicas
                ) < 0.7
                and
                kube_deployment_spec_replicas > 0
                and
                (
                  avg_over_time(
                    (
                      kube_deployment_status_replicas_available
                      /
                      kube_deployment_spec_replicas
                    )[6h:5m]
                  ) > 0.95
                )
              )
              * on(namespace, cluster) group_left()
              max by (namespace, cluster) (kube_pod_labels{environment="prod", team="Fintech-Sre"})
            for: 10m
            labels:
              severity: critical
            annotations:
              summary: "[Anomaly] Deployment {{ $labels.namespace }}/{{ $labels.deployment }} replica availability kəskin düşüb"
              description: >-
                Deployment {{ $labels.namespace }}/{{ $labels.deployment }}
                available/desired nisbəti {{ $value | humanizePercentage }}-ə düşüb
                (6 saatlıq ortalama > 95% idi). Sudden pod failure, node problemi,
                və ya resource exhaustion ola bilər.
                Cluster: {{ $labels.cluster }}.

          - alert: DeploymentRolloutStalled
            expr: |
              (
                kube_deployment_status_condition{condition="Progressing", status="false"} == 1
                and
                kube_deployment_spec_replicas > 0
              )
              * on(namespace, cluster) group_left()
              max by (namespace, cluster) (kube_pod_labels{environment="prod", team="Fintech-Sre"})
            for: 15m
            labels:
              severity: critical
            annotations:
              summary: "[Anomaly] Deployment {{ $labels.namespace }}/{{ $labels.deployment }} rollout ilişib"
              description: >-
                Deployment {{ $labels.namespace }}/{{ $labels.deployment }}
                rollout 15+ dəqiqədir progress etmir. Image pull failure,
                readiness probe uğursuzluğu, resource quota çatışmazlığı,
                və ya PDB constraint ola bilər.
                Cluster: {{ $labels.cluster }}.

          - alert: DeploymentScaleDownAnomaly
            expr: |
              (
                (
                  kube_deployment_spec_replicas
                  < 0.5 *
                  avg_over_time(kube_deployment_spec_replicas[1h] offset 7d)
                )
                and
                avg_over_time(kube_deployment_spec_replicas[1h] offset 7d) > 1
              )
              * on(namespace, cluster) group_left()
              max by (namespace, cluster) (kube_pod_labels{environment="prod", team="Fintech-Sre"})
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "[Anomaly] Deployment {{ $labels.namespace }}/{{ $labels.deployment }} replica sayı anomal azalıb"
              description: >-
                Deployment {{ $labels.namespace }}/{{ $labels.deployment }}
                hazırkı replica sayı keçən həftənin eyni vaxtının yarısından
                azdır. Gözlənilməz manual scale-down, HPA misconfiguration,
                və ya accidental edit ola bilər.
                Cluster: {{ $labels.cluster }}.

          - alert: DeploymentScaleUpAnomaly
            expr: |
              (
                (
                  kube_deployment_spec_replicas
                  > 3 *
                  avg_over_time(kube_deployment_spec_replicas[1h] offset 7d)
                )
                and
                kube_deployment_spec_replicas > 3
              )
              * on(namespace, cluster) group_left()
              max by (namespace, cluster) (kube_pod_labels{environment="prod", team="Fintech-Sre"})
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "[Anomaly] Deployment {{ $labels.namespace }}/{{ $labels.deployment }} replica sayı anomal artıb"
              description: >-
                Deployment {{ $labels.namespace }}/{{ $labels.deployment }}
                replica sayı keçən həftənin eyni vaxtından 3x artıqdır
                (hazırda > 3). HPA oscillation, traffic anomaliyası,
                və ya misconfiguration ola bilər.
                Cluster: {{ $labels.cluster }}.

          - alert: DeploymentUnavailableReplicaSpike
            expr: |
              (
                (
                  kube_deployment_status_replicas_unavailable > 0
                )
                and
                (
                  avg_over_time(kube_deployment_status_replicas_unavailable[6h:5m]) == 0
                )
                and
                kube_deployment_spec_replicas > 0
              )
              * on(namespace, cluster) group_left()
              max by (namespace, cluster) (kube_pod_labels{environment="prod", team="Fintech-Sre"})
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "[Anomaly] Deployment {{ $labels.namespace }}/{{ $labels.deployment }} unavailable replica yaranıb"
              description: >-
                Deployment {{ $labels.namespace }}/{{ $labels.deployment }}
                son 6 saatda bütün replica-lar available idi, amma indi
                unavailable replica var. Node failure, resource pressure,
                və ya image problemi ola bilər.
                Cluster: {{ $labels.cluster }}.

          - alert: DeploymentReplicaFlapping
            expr: |
              (
                changes(kube_deployment_status_replicas[30m]) > 10
                and
                kube_deployment_spec_replicas > 0
              )
              * on(namespace, cluster) group_left()
              max by (namespace, cluster) (kube_pod_labels{environment="prod", team="Fintech-Sre"})
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "[Anomaly] Deployment {{ $labels.namespace }}/{{ $labels.deployment }} replica-lar flapping edir"
              description: >-
                Deployment {{ $labels.namespace }}/{{ $labels.deployment }}
                son 30 dəqiqədə replica count 10+ dəfə dəyişib. Bu yüksək
                pod churn CrashLoop, OOMKill, HPA oscillation, və ya node
                instability-dən yarana bilər.
                Cluster: {{ $labels.cluster }}.

      # ================================================================
      #  POD/CONTAINER LEVEL LATENCY & ERROR RATE ANOMALY
      #
      #  Mənbə: OpenTelemetry Java auto-instrumentation
      #  Metrik: http_server_request_duration (histogram)
      #  Labels: service_namespace, k8s_pod_name, service_name,
      #          http_request_method, http_response_status_code, http_route
      #
      #  Qeyd: Alloy config-da add_metric_suffixes=false olduğu üçün
      #  metrik adı http_server_request_duration-dır (_seconds yoxdur).
      #  Bu metrik Kubernetes-dən deyil, OTel auto-instrumentation-dan
      #  gəlir. Namespace filter üçün kube_pod_labels ilə label_replace
      #  vasitəsilə join edilir (service_namespace ↔ namespace).
      #  Team filter yoxdur — namespace-lər arası team fərqli ola bilər.
      # ================================================================
      - name: pod-latency-anomaly
        rules:
          - alert: PodLatencyP99SpikeAnomaly
            expr: |
              (
                (
                  histogram_quantile(0.99,
                    sum by (le, service_namespace, k8s_pod_name, service_name) (
                      rate(http_server_request_duration_bucket[10m])
                    )
                  )
                  > 3 *
                  histogram_quantile(0.99,
                    sum by (le, service_namespace, k8s_pod_name, service_name) (
                      rate(http_server_request_duration_bucket[2h])
                    )
                  )
                )
                and
                (
                  histogram_quantile(0.99,
                    sum by (le, service_namespace, k8s_pod_name, service_name) (
                      rate(http_server_request_duration_bucket[2h])
                    )
                  ) > 0.01
                )
                and
                (
                  sum by (service_namespace, k8s_pod_name, service_name) (
                    rate(http_server_request_duration_count[10m])
                  ) > 1
                )
              )
              * on(service_namespace) group_left()
              label_replace(
                max by (namespace) (kube_pod_labels{environment="prod"}),
                "service_namespace", "$1", "namespace", "(.*)"
              )
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "[Anomaly] Pod {{ $labels.service_namespace }}/{{ $labels.k8s_pod_name }} P99 latency kəskin artıb"
              description: >-
                Pod {{ $labels.k8s_pod_name }} ({{ $labels.service_name }})
                P99 latency {{ $value | printf "%.2f" }}s — 2 saatlıq baseline-dan
                3x artıq. Bu spesifik pod-da backend degradation ola bilər.
                Ingress-level alert-dən fərqli olaraq hansı pod-un yavaşladığını
                dəqiq göstərir.

          - alert: PodLatencyP50SpikeAnomaly
            expr: |
              (
                (
                  histogram_quantile(0.50,
                    sum by (le, service_namespace, k8s_pod_name, service_name) (
                      rate(http_server_request_duration_bucket[10m])
                    )
                  )
                  > 2.5 *
                  histogram_quantile(0.50,
                    sum by (le, service_namespace, k8s_pod_name, service_name) (
                      rate(http_server_request_duration_bucket[2h])
                    )
                  )
                )
                and
                (
                  histogram_quantile(0.50,
                    sum by (le, service_namespace, k8s_pod_name, service_name) (
                      rate(http_server_request_duration_bucket[2h])
                    )
                  ) > 0.005
                )
                and
                (
                  sum by (service_namespace, k8s_pod_name, service_name) (
                    rate(http_server_request_duration_count[10m])
                  ) > 1
                )
              )
              * on(service_namespace) group_left()
              label_replace(
                max by (namespace) (kube_pod_labels{environment="prod"}),
                "service_namespace", "$1", "namespace", "(.*)"
              )
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "[Anomaly] Pod {{ $labels.service_namespace }}/{{ $labels.k8s_pod_name }} median latency 2.5x artıb"
              description: >-
                Pod {{ $labels.k8s_pod_name }} ({{ $labels.service_name }})
                median (P50) latency {{ $value | printf "%.3f" }}s — 2 saatlıq
                baseline-dan 2.5x artıq. Bu pod-a gedən requestlərin əksəriyyəti
                təsirlənir.

      - name: pod-error-rate-anomaly
        rules:
          - alert: PodErrorRate5xxAnomaly
            expr: |
              (
                (
                  (
                    sum by (service_namespace, k8s_pod_name, service_name) (
                      rate(http_server_request_duration_count{http_response_status_code=~"5.."}[10m])
                    )
                    /
                    sum by (service_namespace, k8s_pod_name, service_name) (
                      rate(http_server_request_duration_count[10m])
                    )
                  )
                  > 3 *
                  (
                    sum by (service_namespace, k8s_pod_name, service_name) (
                      rate(http_server_request_duration_count{http_response_status_code=~"5.."}[2h])
                    )
                    /
                    sum by (service_namespace, k8s_pod_name, service_name) (
                      rate(http_server_request_duration_count[2h])
                    )
                  )
                )
                and
                (
                  (
                    sum by (service_namespace, k8s_pod_name, service_name) (
                      rate(http_server_request_duration_count{http_response_status_code=~"5.."}[10m])
                    )
                    /
                    sum by (service_namespace, k8s_pod_name, service_name) (
                      rate(http_server_request_duration_count[10m])
                    )
                  ) > 0.01
                )
                and
                (
                  sum by (service_namespace, k8s_pod_name, service_name) (
                    rate(http_server_request_duration_count[10m])
                  ) > 1
                )
              )
              * on(service_namespace) group_left()
              label_replace(
                max by (namespace) (kube_pod_labels{environment="prod"}),
                "service_namespace", "$1", "namespace", "(.*)"
              )
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "[Anomaly] Pod {{ $labels.service_namespace }}/{{ $labels.k8s_pod_name }} 5xx error rate kəskin artıb"
              description: >-
                Pod {{ $labels.k8s_pod_name }} ({{ $labels.service_name }})
                5xx error rate {{ $value | humanizePercentage }} — 2 saatlıq
                baseline-dan 3x artıq. Bu spesifik pod-da exception, dependency
                failure, və ya resource exhaustion ola bilər. Hansı pod-un
                xəta verdiyini dəqiq göstərir.

          - alert: PodErrorRate4xxAnomaly
            expr: |
              (
                (
                  (
                    sum by (service_namespace, k8s_pod_name, service_name) (
                      rate(http_server_request_duration_count{http_response_status_code=~"4.."}[10m])
                    )
                    /
                    sum by (service_namespace, k8s_pod_name, service_name) (
                      rate(http_server_request_duration_count[10m])
                    )
                  )
                  > 3 *
                  (
                    sum by (service_namespace, k8s_pod_name, service_name) (
                      rate(http_server_request_duration_count{http_response_status_code=~"4.."}[2h])
                    )
                    /
                    sum by (service_namespace, k8s_pod_name, service_name) (
                      rate(http_server_request_duration_count[2h])
                    )
                  )
                )
                and
                (
                  (
                    sum by (service_namespace, k8s_pod_name, service_name) (
                      rate(http_server_request_duration_count{http_response_status_code=~"4.."}[10m])
                    )
                    /
                    sum by (service_namespace, k8s_pod_name, service_name) (
                      rate(http_server_request_duration_count[10m])
                    )
                  ) > 0.1
                )
                and
                (
                  sum by (service_namespace, k8s_pod_name, service_name) (
                    rate(http_server_request_duration_count[10m])
                  ) > 1
                )
              )
              * on(service_namespace) group_left()
              label_replace(
                max by (namespace) (kube_pod_labels{environment="prod"}),
                "service_namespace", "$1", "namespace", "(.*)"
              )
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "[Anomaly] Pod {{ $labels.service_namespace }}/{{ $labels.k8s_pod_name }} 4xx error rate anomal artıb"
              description: >-
                Pod {{ $labels.k8s_pod_name }} ({{ $labels.service_name }})
                4xx error rate {{ $value | humanizePercentage }} — 2 saatlıq
                baseline-dan 3x artıq. Bu pod-da auth problemi, validation
                failure, və ya broken client request pattern ola bilər.

      # ================================================================
      #  ROUTE-LEVEL LATENCY ANOMALY (SERVICE AGGREGATE)
      #
      #  Bütün podlar üzrə sum edilib, service_name + http_route-a görə
      #  qruplaşdırılıb. Per-pod alert-dən fərqli olaraq service-in
      #  ümumi vəziyyətini göstərir — bir pod yavaşlasa digərləri
      #  kompensasiya edə bilər, amma bütün podlar yavaşlayırsa
      #  bu alert tutur.
      # ================================================================
      - name: route-latency-anomaly
        rules:
          - alert: RouteLatencyP99SpikeAnomaly
            expr: |
              (
                (
                  histogram_quantile(0.99,
                    sum by (le, service_namespace, service_name, http_route) (
                      rate(http_server_request_duration_bucket[10m])
                    )
                  )
                  > 3 *
                  histogram_quantile(0.99,
                    sum by (le, service_namespace, service_name, http_route) (
                      rate(http_server_request_duration_bucket[2h])
                    )
                  )
                )
                and
                (
                  histogram_quantile(0.99,
                    sum by (le, service_namespace, service_name, http_route) (
                      rate(http_server_request_duration_bucket[2h])
                    )
                  ) > 0.01
                )
                and
                (
                  sum by (service_namespace, service_name, http_route) (
                    rate(http_server_request_duration_count[10m])
                  ) > 1
                )
              )
              * on(service_namespace) group_left()
              label_replace(
                max by (namespace) (kube_pod_labels{environment="prod"}),
                "service_namespace", "$1", "namespace", "(.*)"
              )
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "[Anomaly] {{ $labels.service_name }} {{ $labels.http_route }} P99 latency kəskin artıb"
              description: >-
                Service {{ $labels.service_name }} ({{ $labels.service_namespace }})
                {{ $labels.http_route }} endpoint P99 latency {{ $value | printf "%.2f" }}s —
                2 saatlıq baseline-dan 3x artıq. Bütün podlar üzrə aggregate
                nəticədir — endpoint səviyyəsində degradation var.

          - alert: RouteLatencyP50SpikeAnomaly
            expr: |
              (
                (
                  histogram_quantile(0.50,
                    sum by (le, service_namespace, service_name, http_route) (
                      rate(http_server_request_duration_bucket[10m])
                    )
                  )
                  > 2.5 *
                  histogram_quantile(0.50,
                    sum by (le, service_namespace, service_name, http_route) (
                      rate(http_server_request_duration_bucket[2h])
                    )
                  )
                )
                and
                (
                  histogram_quantile(0.50,
                    sum by (le, service_namespace, service_name, http_route) (
                      rate(http_server_request_duration_bucket[2h])
                    )
                  ) > 0.005
                )
                and
                (
                  sum by (service_namespace, service_name, http_route) (
                    rate(http_server_request_duration_count[10m])
                  ) > 1
                )
              )
              * on(service_namespace) group_left()
              label_replace(
                max by (namespace) (kube_pod_labels{environment="prod"}),
                "service_namespace", "$1", "namespace", "(.*)"
              )
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "[Anomaly] {{ $labels.service_name }} {{ $labels.http_route }} median latency 2.5x artıb"
              description: >-
                Service {{ $labels.service_name }} ({{ $labels.service_namespace }})
                {{ $labels.http_route }} endpoint median (P50) latency
                {{ $value | printf "%.3f" }}s — 2 saatlıq baseline-dan 2.5x artıq.
                Bu endpoint-ə gedən requestlərin əksəriyyəti təsirlənir.

      # ================================================================
      #  ROUTE-LEVEL ERROR RATE ANOMALY (SERVICE AGGREGATE)
      #
      #  Bütün podlar üzrə sum edilib, service_name + http_route-a görə.
      #  Bir pod-un error-u service-level rate-ə təsir etməyə bilər,
      #  amma bütün podlarda eyni route error verirsə bu alert tutur.
      # ================================================================
      - name: route-error-rate-anomaly
        rules:
          - alert: RouteErrorRate5xxAnomaly
            expr: |
              (
                (
                  (
                    sum by (service_namespace, service_name, http_route) (
                      rate(http_server_request_duration_count{http_response_status_code=~"5.."}[10m])
                    )
                    /
                    sum by (service_namespace, service_name, http_route) (
                      rate(http_server_request_duration_count[10m])
                    )
                  )
                  > 3 *
                  (
                    sum by (service_namespace, service_name, http_route) (
                      rate(http_server_request_duration_count{http_response_status_code=~"5.."}[2h])
                    )
                    /
                    sum by (service_namespace, service_name, http_route) (
                      rate(http_server_request_duration_count[2h])
                    )
                  )
                )
                and
                (
                  (
                    sum by (service_namespace, service_name, http_route) (
                      rate(http_server_request_duration_count{http_response_status_code=~"5.."}[10m])
                    )
                    /
                    sum by (service_namespace, service_name, http_route) (
                      rate(http_server_request_duration_count[10m])
                    )
                  ) > 0.01
                )
                and
                (
                  sum by (service_namespace, service_name, http_route) (
                    rate(http_server_request_duration_count[10m])
                  ) > 1
                )
              )
              * on(service_namespace) group_left()
              label_replace(
                max by (namespace) (kube_pod_labels{environment="prod"}),
                "service_namespace", "$1", "namespace", "(.*)"
              )
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "[Anomaly] {{ $labels.service_name }} {{ $labels.http_route }} 5xx error rate kəskin artıb"
              description: >-
                Service {{ $labels.service_name }} ({{ $labels.service_namespace }})
                {{ $labels.http_route }} endpoint 5xx error rate
                {{ $value | humanizePercentage }} — 2 saatlıq baseline-dan 3x artıq.
                Bütün podlar üzrə aggregate nəticədir — endpoint səviyyəsində
                failure var.

          - alert: RouteErrorRate4xxAnomaly
            expr: |
              (
                (
                  (
                    sum by (service_namespace, service_name, http_route) (
                      rate(http_server_request_duration_count{http_response_status_code=~"4.."}[10m])
                    )
                    /
                    sum by (service_namespace, service_name, http_route) (
                      rate(http_server_request_duration_count[10m])
                    )
                  )
                  > 3 *
                  (
                    sum by (service_namespace, service_name, http_route) (
                      rate(http_server_request_duration_count{http_response_status_code=~"4.."}[2h])
                    )
                    /
                    sum by (service_namespace, service_name, http_route) (
                      rate(http_server_request_duration_count[2h])
                    )
                  )
                )
                and
                (
                  (
                    sum by (service_namespace, service_name, http_route) (
                      rate(http_server_request_duration_count{http_response_status_code=~"4.."}[10m])
                    )
                    /
                    sum by (service_namespace, service_name, http_route) (
                      rate(http_server_request_duration_count[10m])
                    )
                  ) > 0.1
                )
                and
                (
                  sum by (service_namespace, service_name, http_route) (
                    rate(http_server_request_duration_count[10m])
                  ) > 1
                )
              )
              * on(service_namespace) group_left()
              label_replace(
                max by (namespace) (kube_pod_labels{environment="prod"}),
                "service_namespace", "$1", "namespace", "(.*)"
              )
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "[Anomaly] {{ $labels.service_name }} {{ $labels.http_route }} 4xx error rate anomal artıb"
              description: >-
                Service {{ $labels.service_name }} ({{ $labels.service_namespace }})
                {{ $labels.http_route }} endpoint 4xx error rate
                {{ $value | humanizePercentage }} — 2 saatlıq baseline-dan 3x artıq.
                API change sonrası broken client, auth problemi, və ya
                validation failure ola bilər.
